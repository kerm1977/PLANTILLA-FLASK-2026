<button type="button" class="collapsible-tab mt-3" data-bs-toggle="collapse" data-bs-target="#noticumbresAdminSection" aria-expanded="{% if request.args.get('section') == 'noticumbresAdmin' %}true{% else %}false{% endif %}" aria-controls="noticumbresAdminSection">
    <span><i class="bi bi-newspaper me-2"></i>{{ _('Administrador de noticias') }}</span>
    <i class="bi bi-chevron-down collapsible-tab-icon"></i>
  </button>
  <div class="collapse{% if request.args.get('section') == 'noticumbresAdmin' %} show{% endif %}" id="noticumbresAdminSection" data-bs-parent="#dashboardAccordion">
    <form method="POST" action="{{ url_for('main.dashboard') }}" class="perfil-data">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="save_noticumbres_config" value="1">

      <div class="perfil-row flex-column align-items-start">
        <label class="perfil-label w-100" for="noticumbres_update_time">{{ _('Hora de actualización') }}</label>
        <input type="time" class="form-control" id="noticumbres_update_time" name="noticumbres_update_time" value="{{ noticumbres_config.config.get('update_time', '') }}">
      </div>

      <div class="perfil-row flex-column align-items-start">
        <label class="perfil-label w-100" for="noticumbres_max_posts">{{ _('Máximo de noticias visibles') }}</label>
        <input type="number" class="form-control" id="noticumbres_max_posts" name="noticumbres_max_posts" min="0" value="{{ noticumbres_config.config.get('max_posts', '') }}">
      </div>

      <div class="perfil-row">
        <span class="perfil-label">{{ _('Total de publicaciones') }}</span>
        <span class="perfil-value">{{ noticumbres_config.posts|length }}</span>
      </div>

      <div class="perfil-row">
        <span class="perfil-label">{{ _('Publicaciones activas') }}</span>
        <span class="perfil-value">{{ noticumbres_config.posts | selectattr('is_published') | list | length }}</span>
      </div>

      <div class="text-end mt-3">
        <button type="submit" class="btn btn-success btn-sm">
          <i class="bi bi-check-lg"></i> {{ _('Guardar configuración') }}
        </button>
      </div>
    </form>
  </div>
